name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Price matching rules
        run: node --test tools/pricing.test.mjs

      - name: Rebuild generated output
        # Fails the build if any price lands off the approved ladder.
        run: node tools/build.mjs

      - name: Check generated files are committed
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated output is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      # Enables GitHub Pages on first run if it is not already on.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
