# Deploy from THIS directory (repo/worker), or wrangler will pick up whatever
# config it finds in the directory you are actually standing in.
name = "moddose-checkout"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Deliberately no [env.*] blocks. A second environment here means every
# `wrangler secret put` warns about ambiguous targets and can write to the
# wrong one. For local testing use `wrangler dev`, which uses these vars.
[vars]
SITE_ORIGIN = "https://moddose.com"
CURRENCY = "usd"
SUBSCRIBE_DISCOUNT = "0.2"
FREE_SHIPPING_THRESHOLD = "50"
SHIPPING_FLAT = "5.95"
AUTOMATIC_TAX = "false"

# Secrets are NOT set here — they would end up in git. Use:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
